<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scrabble Connect</title>
<style>
  :root { --bg:#14161a; --card:#1e2127; --txt:#eef0f3; --mut:#9aa1ad; --acc:#e8b84a; --line:#2d3139; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--txt); font:16px system-ui,sans-serif; display:flex; flex-direction:column; }
  header { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; background:var(--card); border-bottom:1px solid var(--line); }
  header b { color:var(--acc); font-size:18px; }
  button { background:var(--acc); color:#111; border:0; border-radius:10px; padding:12px 16px; font-size:16px; font-weight:600; }
  button.ghost { background:transparent; color:var(--mut); border:1px solid var(--line); padding:8px 12px; font-size:14px; }
  input { width:100%; padding:12px; margin:6px 0; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--txt); font-size:16px; }
  #auth { max-width:380px; margin:auto; padding:24px; width:100%; }
  #auth h1 { color:var(--acc); text-align:center; }
  #auth button { width:100%; margin-top:8px; }
  .link { color:var(--mut); text-align:center; margin-top:14px; text-decoration:underline; }
  #err { color:#ff8a80; min-height:20px; margin-top:8px; text-align:center; }
  #app { display:none; flex:1; flex-direction:column; min-height:0; }
  #msgs { flex:1; overflow-y:auto; padding:12px 16px; }
  .m { margin:8px 0; }
  .m small { color:var(--mut); }
  .m .u { color:var(--acc); font-weight:600; }
  .m.me .u { color:#7fd1ae; }
  #send { display:flex; gap:8px; padding:10px 12px; background:var(--card); border-top:1px solid var(--line); }
  #send input { margin:0; flex:1; }
</style>
</head>
<body>

<div id="auth">
  <h1>Scrabble Connect</h1>
  <input id="username" placeholder="Pseudo (3 à 20 caractères)" style="display:none" autocomplete="username">
  <input id="email" type="email" placeholder="E-mail" autocomplete="email">
  <input id="password" type="password" placeholder="Mot de passe (6 caractères min.)" autocomplete="current-password">
  <button id="go">Se connecter</button>
  <div class="link" id="toggle">Pas de compte ? Créer un compte</div>
  <div id="err"></div>
</div>

<div id="app">
  <header><b>Scrabble Connect</b><span><span id="me" style="color:var(--mut);margin-right:8px"></span><button class="ghost" id="logout">Quitter</button></span></header>
  <div id="msgs"></div>
  <form id="send"><input id="text" placeholder="Écris un message…" maxlength="500" autocomplete="off"><button>Envoyer</button></form>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const sb = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_KEY);
const $ = id => document.getElementById(id);
let signup = false, user = null, names = {}, channel = null;

$('toggle').onclick = () => {
  signup = !signup;
  $('username').style.display = signup ? 'block' : 'none';
  $('go').textContent = signup ? 'Créer mon compte' : 'Se connecter';
  $('toggle').textContent = signup ? 'Déjà un compte ? Se connecter' : 'Pas de compte ? Créer un compte';
  $('err').textContent = '';
};

$('go').onclick = async () => {
  $('err').textContent = '';
  const email = $('email').value.trim(), password = $('password').value;
  let res;
  if (signup) {
    const username = $('username').value.trim();
    if (username.length < 3) return $('err').textContent = 'Pseudo trop court.';
    res = await sb.auth.signUp({ email, password, options: { data: { username } } });
    if (!res.error && !res.data.session) return $('err').textContent = 'Compte créé. Confirme ton e-mail puis connecte-toi.';
  } else {
    res = await sb.auth.signInWithPassword({ email, password });
  }
  if (res.error) $('err').textContent = res.error.message;
};

$('logout').onclick = () => sb.auth.signOut();

sb.auth.onAuthStateChange((_e, session) => {
  if (session) start(session.user); else stop();
});

async function start(u) {
  if (user && user.id === u.id) return;
  user = u;
  $('auth').style.display = 'none';
  $('app').style.display = 'flex';
  await loadNames();
  $('me').textContent = names[u.id] || '';
  $('msgs').innerHTML = '';
  const { data } = await sb.from('messages').select('*').is('game_id', null)
    .order('created_at', { ascending: false }).limit(50);
  (data || []).reverse().forEach(addMsg);
  channel = sb.channel('chat-general')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, async p => {
      if (p.new.game_id !== null) return;
      if (!names[p.new.user_id]) await loadNames();
      addMsg(p.new);
    }).subscribe();
}

function stop() {
  user = null;
  if (channel) sb.removeChannel(channel);
  $('app').style.display = 'none';
  $('auth').style.display = 'block';
}

async function loadNames() {
  const { data } = await sb.from('profiles').select('id,username');
  (data || []).forEach(p => names[p.id] = p.username);
}

function addMsg(m) {
  const d = document.createElement('div');
  d.className = 'm' + (m.user_id === user.id ? ' me' : '');
  const t = new Date(m.created_at).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  const u = document.createElement('span'); u.className = 'u'; u.textContent = names[m.user_id] || 'Joueur';
  const s = document.createElement('small'); s.textContent = ' ' + t;
  const c = document.createElement('div'); c.textContent = m.content;
  d.append(u, s, c);
  $('msgs').appendChild(d);
  $('msgs').scrollTop = $('msgs').scrollHeight;
}

$('send').onsubmit = async e => {
  e.preventDefault();
  const content = $('text').value.trim();
  if (!content) return;
  $('text').value = '';
  const { error } = await sb.from('messages').insert({ user_id: user.id, content });
  if (error) alert(error.message);
};

sb.auth.getSession().then(({ data }) => { if (data.session) start(data.session.user); });
</script>
</body>
</html>
