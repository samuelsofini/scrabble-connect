<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Scrabble Connect</title>
<style>
  :root { --bg:#14161a; --card:#1e2127; --txt:#eef0f3; --mut:#9aa1ad; --acc:#e8b84a; --line:#2d3139; --ok:#7fd1ae; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html,body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--txt); font:16px system-ui,sans-serif; display:flex; flex-direction:column; }
  header { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; background:var(--card); border-bottom:1px solid var(--line); }
  header b { color:var(--acc); font-size:18px; }
  button { background:var(--acc); color:#111; border:0; border-radius:10px; padding:12px 16px; font-size:16px; font-weight:600; }
  button.ghost { background:transparent; color:var(--mut); border:1px solid var(--line); padding:8px 12px; font-size:14px; }
  button.red { background:#c0392b; color:#fff; }
  input { width:100%; padding:12px; margin:6px 0; border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--txt); font-size:16px; }
  #auth { max-width:380px; margin:auto; padding:24px; width:100%; }
  #auth h1 { color:var(--acc); text-align:center; }
  #auth button { width:100%; margin-top:8px; }
  .link { color:var(--mut); text-align:center; margin-top:14px; text-decoration:underline; }
  #err { color:#ff8a80; min-height:20px; margin-top:8px; text-align:center; }
  #app { display:none; flex:1; flex-direction:column; min-height:0; }
  .view { flex:1; overflow-y:auto; padding:12px 16px; min-height:0; }
  #v-game { display:flex; flex-direction:column; padding:0; }
  #gInfo { padding:12px 16px; border-bottom:1px solid var(--line); }
  #gMsgs { flex:1; overflow-y:auto; padding:8px 16px; }
  h2 { margin:4px 0 12px; font-size:18px; }
  .m { margin:8px 0; } .m small { color:var(--mut); }
  .m .u { color:var(--acc); font-weight:600; } .m.me .u { color:var(--ok); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:10px; }
  .card.sel { border-color:var(--acc); }
  .row { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .sub { color:var(--mut); font-size:14px; margin-top:4px; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:#555; margin-right:8px; }
  .dot.on { background:#3ddc84; }
  .tag { background:var(--acc); color:#111; border-radius:20px; padding:2px 8px; font-size:12px; font-weight:700; }
  .btns { display:flex; gap:8px; margin-top:10px; }
  .btns button { flex:1; }
  #send { display:flex; gap:8px; padding:10px 12px; background:var(--card); border-top:1px solid var(--line); }
  #send input { margin:0; flex:1; }
  nav { display:flex; background:var(--card); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px); }
  nav button { flex:1; background:transparent; color:var(--mut); border-radius:0; padding:14px 4px; font-size:15px; }
  nav button.on { color:var(--acc); border-top:2px solid var(--acc); }
  header { padding-top:calc(12px + env(safe-area-inset-top,0px)); }
  #gBoard { flex:1; overflow-y:auto; padding:8px 12px; }
  .grid { display:grid; grid-template-columns:repeat(15,1fr); gap:1px; background:#0c0d10; width:100%; max-width:520px; margin:8px auto; aspect-ratio:1; }
  .cell { background:#2a6b55; aspect-ratio:1; font-size:8px; display:flex; align-items:center; justify-content:center; color:#d6efe4; position:relative; }
  .p-TW { background:#c0392b; } .p-DW { background:#d98aa0; } .p-TL { background:#2e6fb0; } .p-DL { background:#7fb3d9; color:#123; }
  .tile { background:#e8d4a2 !important; color:#222; font-weight:700; font-size:14px; }
  .tile.pend { outline:2px solid #e8b84a; background:#f6e3a6 !important; }
  .tile.blank { color:#c0392b; }
  .tile sub { font-size:7px; position:absolute; right:1px; bottom:0; }
  .rack { display:flex; gap:6px; justify-content:center; margin:10px 0; min-height:44px; }
  .rk { width:40px; height:44px; border-radius:6px; background:#e8d4a2; color:#222; font-weight:700; font-size:20px; border:0; padding:0; }
  .rk.on { outline:3px solid var(--acc); }
  button:disabled { opacity:.45; }
</style>
</head>
<body>

<div id="auth">
  <h1>Scrabble Connect</h1>
  <input id="username" placeholder="Pseudo (3 à 20 caractères)" style="display:none" autocomplete="username">
  <input id="email" type="email" placeholder="E-mail" autocomplete="email">
  <input id="password" type="password" placeholder="Mot de passe (6 caractères min.)" autocomplete="current-password">
  <button id="go">Se connecter</button>
  <div class="link" id="toggle">Pas de compte ? Créer un compte</div>
  <div id="err"></div>
</div>

<div id="app">
  <header><b>Scrabble Connect</b><span><span id="me" style="color:var(--mut);margin-right:8px"></span><button class="ghost" id="logout">Quitter</button></span></header>
  <div id="v-chat" class="view"></div>
  <div id="v-games" class="view" hidden></div>
  <div id="v-players" class="view" hidden></div>
  <div id="v-game" class="view" hidden><div id="gInfo"></div><div id="gBoard" hidden></div><div id="gMsgs" hidden></div></div>
  <form id="send"><input id="text" placeholder="Écris un message…" maxlength="500" autocomplete="off"><button>Envoyer</button></form>
  <nav>
    <button data-t="chat" class="on">💬 Chat</button>
    <button data-t="games">🎲 Parties <span id="badge" class="tag" hidden></span></button>
    <button data-t="players">👥 Joueurs</button>
  </nav>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
</body>
</html>
